name: Comprehensive Code Quality Check

# Trigger on main development workflows
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Workflow to ensure code quality, test coverage, and system integrity
jobs:
  code-validation:
    name: Validate Code and Run Tests
    runs-on: ubuntu-latest

    # MySQL service for database testing
    services:
      database:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql, openssl
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP Dependencies
        run: |
          composer validate --strict
          composer install --prefer-dist --no-progress --no-suggest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Assets
        run: npm run build

      - name: Prepare Testing Database
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          mysql -h 127.0.0.1 -u root -p${{ secrets.DB_ROOT_PASSWORD }} -e "CREATE DATABASE IF NOT EXISTS testing;"

      - name: Configure Laravel Testing Environment
        run: |
          cp .env.testing.example .env.testing
          php artisan key:generate --env=testing
          php artisan config:clear
          php artisan config:cache

      - name: Run Database Migrations
        run: |
          php artisan migrate:fresh --force
          php artisan db:seed --force

      - name: Static Code Analysis
        run: |
          php ./vendor/bin/rector --dry-run
          php ./vendor/bin/pint --test
          php -d memory_limit=-1 ./vendor/bin/phpstan analyse

      - name: Run Test Suite
        run: |
          php -d memory_limit=-1 vendor/bin/pest --coverage --exactly=61.0
          php -d memory_limit=-1 vendor/bin/pest --type-coverage --min=97.5

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage
          retention-days: 7
          compression-level: 6

  notify-failure:
    name: Notify on Workflow Failure
    needs: code-validation
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Code validation failed on ${{ github.ref }}'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
